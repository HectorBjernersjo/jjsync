[package]
name = "jjsync"
version = "0.2.0"
edition = "2021"
description = "Background synchronization for Jujutsu repositories"
repository = "https://github.com/HectorBjernersjo/jjsync"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
