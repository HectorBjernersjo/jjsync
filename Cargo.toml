[package]
name = "jjsync"
version = "0.1.0"
edition = "2021"
description = "Background synchronization for Jujutsu repositories"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
